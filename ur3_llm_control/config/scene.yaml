skill_executor:
  ros__parameters:
    use_sim_time: true
    planning_group: ur_manipulator
    frame_id: world
    home_target: up
    home_joint_positions: [0.0, -1.5707, 0.0, -1.5707, 0.0, 0.0]
    execute_motion: true
    inter_object_pause_seconds: 0.5

    planning_time: 10.0
    planner_id: RRTConnectkConfigDefault
    planning_attempts: 1
    ik_timeout: 0.50
    max_joint_delta: 3.05
    transit_joint_margin: 0.20
    cartesian_eef_step: 0.005
    # Absolute per-joint checks below replace MoveIt's relative average-jump filter.
    cartesian_jump_threshold: 0.0
    cartesian_max_joint_step: 0.10
    trajectory_detour_allowance: 0.75
    min_cartesian_fraction: 1.0
    velocity_scale: 0.10
    acceleration_scale: 0.10
    cartesian_velocity_scale: 0.05
    cartesian_acceleration_scale: 0.03

    cube_size: 0.04
    grasp_offset: 0.116
    ik_seed_target: test_configuration
    approach_height: 0.12
    placement_clearance: 0.002
    tool_orientation: [1.0, 0.0, 0.0, 0.0]
    gripper_action: /gripper_controller/follow_joint_trajectory
    gripper_open_position: 0.0
    gripper_closed_position: 0.018
    gripper_timeout: 5.0

    table.position: [0.25, 0.0, 0.70]
    table.size: [0.80, 0.65, 0.04]

    zones.zone_a: [0.40, 0.14, 0.740]
    zones.zone_b: [0.40, 0.0, 0.740]
    zones.zone_c: [0.40, -0.14, 0.740]

    plan_topic: /validated_plan
    status_topic: /task_status
